// The concierge mount (#brand-concierge-mount) is injected by the footer block,
// which loads asynchronously. Wait for it before bootstrapping so the experience
// mounts reliably regardless of whether the footer or the fetch resolves first.
function waitForElement(selector, timeout = 15000) {
    return new Promise((resolve) => {
        const existing = document.querySelector(selector);
        if (existing) {
            resolve(existing);
            return;
        }
        const observer = new MutationObserver(() => {
            const el = document.querySelector(selector);
            if (el) {
                observer.disconnect();
                resolve(el);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(() => {
            observer.disconnect();
            resolve(document.querySelector(selector));
        }, timeout);
    });
}

Promise.all([
    window["alloy"]("sendEvent", {
        conversation: {
            fetchConversationalExperience: true
        }

    waitForElement("#brand-concierge-mount")
